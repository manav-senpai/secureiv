[data-theme="dark"]{
  --bg:#0B1728; --panel:#122236; --border:#213247;
  --ink:#E7EDF6; --muted:#96A6BE; --muted-2:#71829C; --blue-tint:#17294A;
  --green-tint:#0F2A20; --amber-tint:#2E2410; --red-tint:#301415; --violet-tint:#211A38;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .2s,color .2s;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.mono{font-family:'SF Mono','Consolas',monospace;}
a{color:inherit;}
.hidden{display:none !important;}
img.brandlogo{height:34px;width:auto;object-fit:contain;}

/* ---------------- LOGIN SCREEN ---------------- */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EEF3F9,#DCE7F7);padding:20px;
}
.login-card{background:var(--panel);border-radius:18px;box-shadow:0 20px 50px rgba(15,36,64,.15);padding:40px;max-width:380px;width:100%;text-align:center;}
.login-card img{height:52px;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:22px;}
.login-desc{font-size:12.5px;color:var(--muted-2);margin-bottom:24px;}
.field{margin-bottom:14px;text-align:left;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--muted);}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13.5px;}
.field-pass{position:relative;}
.field-pass .toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;background:none;border:none;}
.remember-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px;font-size:12.5px;color:var(--muted);}
.btn{font-size:13px;font-weight:700;padding:11px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--ink);}
.btn:hover{border-color:var(--blue);}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);width:100%;}
.btn.primary:hover{background:#254c94;}
.btn.ghost{background:transparent;width:100%;margin-top:10px;}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red);}
.btn.success{background:var(--green);color:#fff;border-color:var(--green);}
.btn.sm{padding:6px 11px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.login-demo{font-size:11px;color:var(--muted-2);margin-top:18px;background:var(--bg);border:1px dashed var(--border);padding:8px 10px;border-radius:8px;}
.err-msg{color:var(--red);font-size:12px;margin-top:-6px;margin-bottom:10px;text-align:left;display:none;}

/* ---------------- APP SHELL ---------------- */
#app{display:none;}
#app.active{display:flex;min-height:100vh;}
.sidebar{width:230px;flex-shrink:0;background:var(--navy);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar .brandrow{display:flex;align-items:center;gap:8px;padding:8px 10px 20px;}
.sidebar .brandrow img{height:30px;}
.navlist{list-style:none;margin:0;padding:0;}
.navlist li+li{margin-top:3px;}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;color:#AEC0DE;font-size:13.5px;font-weight:500;}
.navitem i{width:18px;text-align:center;}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.navitem.active{background:var(--blue);color:#fff;}
.navitem .navbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.12);margin-top:10px;padding-top:10px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:50;}
.tb-left{display:flex;align-items:center;gap:12px;}
.tb-left img{height:26px;display:block;}
.tb-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted);}
.icon-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:6px;border-radius:8px;}
.icon-btn:hover{background:var(--bg);color:var(--ink);}
.hamburger{display:none;}
.content{padding:24px 26px 90px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.pagehead h1{font-size:22px;margin:0;font-weight:800;}
.pagehead .sub{font-size:12.5px;color:var(--muted);}

/* ---------------- shared ---------------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);}
.panel+.panel{margin-top:16px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.panel-head h3{font-size:15px;margin:0;font-weight:700;}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:1000px){.grid2,.grid4{grid-template-columns:1fr 1fr;}}
@media (max-width:620px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

.mini{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.mini .mlabel{font-size:11px;color:var(--muted);font-weight:600;}
.mini .mval{font-size:19px;font-weight:800;margin-top:2px;}
.mini .mval small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px;}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;letter-spacing:.02em;}
.pill.NORMAL,.pill.green,.pill.Completed,.pill.PASS{background:var(--green-tint);color:var(--green);}
.pill.DEVIATION,.pill.amber,.pill.WARNING,.pill.Warning{background:var(--amber-tint);color:var(--amber);}
.pill.STOPPED,.pill.red,.pill.CRITICAL,.pill.Critical,.pill.FAIL{background:var(--red-tint);color:var(--red);}
.pill.COMPLETED,.pill.violet{background:var(--violet-tint);color:var(--violet);}
.pill.Info,.pill.INFO{background:var(--blue-tint);color:var(--blue);}
.dotstatus{width:7px;height:7px;border-radius:50%;background:currentColor;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:8px 9px;border-bottom:1px solid var(--border);}
td{padding:10px 9px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:var(--bg);}

.field-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);gap:14px;}
.field-row:last-child{border-bottom:none;}
.field-row .flabel{font-size:13px;font-weight:600;}
.field-row .fdesc{font-size:11.5px;color:var(--muted);margin-top:2px;}
.switch{position:relative;width:40px;height:22px;background:var(--border);border-radius:12px;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--blue);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .15s;}
.switch.on .knob{left:20px;}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.seg button{border:none;background:var(--panel);color:var(--muted);padding:7px 13px;font-size:12px;font-weight:700;}
.seg button.active{background:var(--navy);color:#fff;}

.status-banner{border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;}
.status-banner .sbicon{font-size:26px;}
.status-banner b{display:block;font-size:16px;}
.status-banner span{font-size:12.5px;opacity:.85;}
.status-banner.NORMAL{background:var(--green-tint);color:var(--green);}
.status-banner.DEVIATION{background:var(--amber-tint);color:var(--amber);}
.status-banner.STOPPED{background:var(--red-tint);color:var(--red);}
.status-banner.COMPLETED{background:var(--violet-tint);color:var(--violet);}

.check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.check-row .ci{width:30px;text-align:center;color:var(--muted);}
.check-row .ctext{flex:1;}
.check-row .ctext b{font-size:13px;display:block;}
.check-row .ctext span{font-size:11.5px;color:var(--muted);}
.check-dot{width:10px;height:10px;border-radius:50%;}
.check-dot.pass{background:var(--green);} .check-dot.warn{background:var(--amber);} .check-dot.fail{background:var(--red);} .check-dot.pending{background:var(--border);}

.toast-wrap{position:fixed;top:72px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;max-width:320px;}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(15,36,64,.18);animation:slidein .2s ease-out;}
.toast.Critical{border-left-color:var(--red);}
.toast.Warning{border-left-color:var(--amber);}
@keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast .ttitle{font-size:12px;font-weight:800;margin-bottom:3px;}
.toast .tbody{font-size:12.5px;color:var(--muted);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:900;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--panel);border-radius:14px;padding:24px;max-width:380px;width:90%;text-align:center;}
.modal-box p{font-size:13.5px;color:var(--muted);margin:10px 0 20px;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}

.alert-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.alert-item:last-child{border-bottom:none;}
.alert-item.unread{background:var(--blue-tint);border-radius:8px;padding:13px 10px;margin-bottom:2px;}
.alert-item .aicon{font-size:16px;margin-top:2px;}
.alert-item .abody{flex:1;}
.alert-item .atitle{font-size:13px;font-weight:700;}
.alert-item .adesc{font-size:12px;color:var(--muted);margin-top:2px;}
.alert-item .atime{font-size:10.5px;color:var(--muted-2);margin-top:3px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chipbtn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);}
.chipbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;max-width:300px;}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;flex:1;color:var(--ink);}

.chartwrap{position:relative;height:280px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.about-logo{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.about-logo img{height:42px;}
.disclaimer-box{background:var(--amber-tint);border:1px solid var(--amber-border);border-radius:10px;padding:14px 16px;font-size:12.5px;color:#6B4E12;line-height:1.6;}

@media print{
  .sidebar,.topbar,.tabbar,.no-print{display:none !important;}
  .content{padding:0;}
  body{background:#fff;}
}

@media (max-width:860px){
  .sidebar{display:none;}
  #app.active{flex-direction:column;}
  .hamburger{display:block;}
  .tb-left img{display:block;}
  .content{padding:16px 14px 90px;}
}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:800;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--navy);z-index:801;padding:18px 12px;transform:translateX(-100%);transition:transform .2s;}
.drawer.open{transform:translateX(0);}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:200;}
.tabbar-row{display:flex;overflow-x:auto;}
.tabbtn{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:var(--muted-2);font-size:9.5px;font-weight:600;}
.tabbtn.active{color:var(--blue);}
@media (max-width:860px){.tabbar{display:block;}}
</style>
</head>
<body data-theme="light">
<div id="root"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

<script>
/* =========================================================================
   SECURE-IV — standalone demo application
   Simulated gravity-IV infusion monitoring. No real hardware, no backend.
   ========================================================================= */
const LOGO_B64 = document.querySelector('style') ? getComputedStyle(document.documentElement).getPropertyValue('--logo-url') : '';
// Extract the same base64 used for the CSS var so <img> tags can reuse it.
const LOGO_SRC = (function(){
  const m = /data:image\/png;base64,([A-Za-z0-9+/=]+)/.exec(LOGO_B64);
  return m ? 'data:image/png;base64,'+m[1] : '';
})();

/* ---------------- persistence ---------------- */
const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },
};
const KEYS = { settings:'secureiv_settings', history:'secureiv_history', calibration:'secureiv_calibration', ui:'secureiv_ui' };

const DEFAULT_SETTINGS = {
  deviceName:'SECURE-IV Bedside Unit', deviceId:'SEC-ESP32-01',
  defaultDropFactor:20, defaultFluid:'Normal Saline (0.9% NaCl)', defaultTargetRate:100, simSpeed:5,
  maxDeviation:15, minDeviation:-15, noDropTimeout:20, lowBatteryThreshold:20, sensorDisagreementThreshold:18,
  soundOn:true, notifPref:true, theme:'light',
};
const DEFAULT_CALIBRATION = {
  loadCell:{ done:false, lastDate:null, knownWeight:500, rawValue:null, factor:1.00 },
  optical:{ done:false, lastDate:null, sensitivity:50 },
};

/* ---------------- global state ---------------- */
const state = {
  auth:{ loggedIn:false, username:'', guest:false },
  settings: LS.get(KEYS.settings, DEFAULT_SETTINGS),
  calibration: LS.get(KEYS.calibration, DEFAULT_CALIBRATION),
  history: LS.get(KEYS.history, []),
  currentView:'dashboard',
  session:null,          // active infusion session
  selfCheck:{ running:false, done:false, simulateFail:false, results:{} },
  demoScenario:'normal',
  randomFaults:false,
  engineTimer:null,
  chart:null,
  graphRange:'live',
  alertFilter:'All',
  historySearch:'', historyStatusFilter:'All', historySort:'newest',
};
document.body.dataset.theme = state.settings.theme;

function saveSettings(){ LS.set(KEYS.settings, state.settings); }
function saveCalibration(){ LS.set(KEYS.calibration, state.calibration); }
function saveHistory(){ LS.set(KEYS.history, state.history); }

/* ---------------- nav config ---------------- */
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:'fa-gauge-high'},
  {id:'newinfusion', label:'New Infusion', icon:'fa-plus'},
  {id:'livemonitoring', label:'Live Monitoring', icon:'fa-wave-square'},
  {id:'parameters', label:'Detailed Parameters', icon:'fa-list-check'},
  {id:'alerts', label:'Alerts & Notifications', icon:'fa-bell', badge:true},
  {id:'history', label:'Infusion History', icon:'fa-clock-rotate-left'},
  {id:'reports', label:'Reports & Export', icon:'fa-file-export'},
  {id:'calibration', label:'Calibration', icon:'fa-sliders'},
  {id:'settings', label:'Settings', icon:'fa-gear'},
  {id:'about', label:'About SECURE-IV', icon:'fa-circle-info'},
];
const TABBAR = ['dashboard','livemonitoring','alerts','history','settings'];

function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
function fmtTime(d){ return new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtDateTime(d){ return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDur(sec){ const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60); return (h>0?h+'h ':'')+m+'m '+s+'s'; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

/* ---------------- toast + modal ---------------- */
function showToast(title, body, severity){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (severity||'Info');
  el.innerHTML = `<div class="ttitle">${title}</div><div class="tbody">${body}</div>`;
  wrap.appendChild(el);
  if(state.settings.soundOn) playBeep(severity);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 6000);
}
let audioCtx;
function playBeep(sev){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.value = sev==='Critical' ? 920 : (sev==='Warning' ? 700 : 500);
    g.gain.value=0.05; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.15);
  }catch(e){}
}
function showModal(title, body, actions){
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h3 style="margin:0 0 4px;font-size:16px;">${title}</h3><p>${body}</p>
    <div class="modal-actions">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-modal-action="${i}">${a.label}</button>`).join('')}</div>`;
  overlay.classList.add('open');
  box.querySelectorAll('[data-modal-action]').forEach((btn,i)=>{
    btn.onclick = ()=>{ overlay.classList.remove('open'); if(actions[i].onClick) actions[i].onClick(); };
  });
}
function confirmModal(title, body, onConfirm){
  showModal(title, body, [
    {label:'Cancel', cls:'ghost'},
    {label:'Confirm', cls:'danger', onClick:onConfirm},
  ]);
}

/* ---------------- LOGIN ---------------- */
function renderLogin(){
  document.getElementById('root').innerHTML = `
  <div id="loginScreen">
    <div class="login-card">
      <img src="${LOGO_SRC}" alt="SECURE-IV">
      <div class="login-sub">Gravity IV Infusion Monitor — Every Drop Matters</div>
      <div class="login-desc">Smart Gravity IV Infusion Monitoring System (software demonstration — simulated authentication, not production security)</div>
      <div class="field"><label>Username</label><input type="text" id="loginUser" placeholder="e.g. nurse01"></div>
      <div class="field field-pass"><label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button type="button" class="toggle-eye" id="togglePass"><i class="fa-solid fa-eye"></i></button>
      </div>
      <div class="err-msg" id="loginErr">Please enter both a username and password.</div>
      <div class="remember-row"><label><input type="checkbox" id="rememberMe"> Remember me</label><span>Demo mode</span></div>
      <button class="btn primary" id="loginBtn">Login</button>
      <button class="btn ghost" id="guestBtn">Continue as Guest</button>
      <div class="login-demo">Demo credentials: <b>nurse01</b> / <b>secureiv123</b> — this is a frontend-only demonstration; no real account system is involved.</div>
    </div>
  </div>`;
  document.getElementById('togglePass').onclick = ()=>{
    const p = document.getElementById('loginPass');
    p.type = p.type==='password' ? 'text' : 'password';
  };
  document.getElementById('loginBtn').onclick = ()=>{
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    const err = document.getElementById('loginErr');
    if(!u || !p){ err.style.display='block'; return; }
    err.style.display='none';
    state.auth = { loggedIn:true, username:u, guest:false };
    bootApp();
  };
  document.getElementById('guestBtn').onclick = ()=>{
    state.auth = { loggedIn:true, username:'Guest', guest:true };
    bootApp();
  };
}

/* ---------------- APP SHELL ---------------- */
function bootApp(){
  document.getElementById('root').innerHTML = `
  <div id="app" class="active">
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
      <div class="brandrow"><img src="${LOGO_SRC}" style="height:26px;"></div>
      <ul class="navlist" id="drawerNav"></ul>
    </div>
    <aside class="sidebar">
      <div class="brandrow"><img src="${LOGO_SRC}" style="height:30px;"></div>
      <ul class="navlist" id="sidebarNav"></ul>
      <div class="sidebar-foot"><div class="navitem" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>Log out</span></div></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="tb-left"><button class="icon-btn hamburger" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button><img src="${LOGO_SRC}"></div>
        <div class="tb-right">
          <span><i class="fa-solid fa-user"></i> ${state.auth.username}</span>
          <button class="icon-btn" id="themeToggleTop"><i class="fa-solid ${state.settings.theme==='dark'?'fa-sun':'fa-moon'}"></i></button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
    <div class="tabbar"><div class="tabbar-row" id="tabbarRow"></div></div>
  </div>`;
  document.getElementById('logoutBtn').onclick = ()=> confirmModal('Log out?','You will return to the login screen. Your session data stays saved on this device.', ()=>{
    if(state.engineTimer) clearInterval(state.engineTimer);
    state.auth = {loggedIn:false, username:'', guest:false};
    renderLogin();
  });
  document.getElementById('hamburgerBtn').onclick = ()=>{ document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); };
  document.getElementById('drawerOverlay').onclick = ()=>{ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); };
  document.getElementById('themeToggleTop').onclick = toggleTheme;
  renderNav();
  switchView('dashboard');
}
function toggleTheme(){
  state.settings.theme = state.settings.theme==='dark' ? 'light' : 'dark';
  document.body.dataset.theme = state.settings.theme;
  saveSettings();
  bootApp();
}
function renderNav(){
  const html = NAV.map(n=>`
    <li class="navitem ${n.id===state.currentView?'active':''}" data-nav="${n.id}">
      <i class="fa-solid ${n.icon}"></i><span>${n.label}</span>
      ${n.badge && unreadAlertCount()>0 ? `<span class="navbadge">${unreadAlertCount()}</span>` : ''}
    </li>`).join('');
  document.getElementById('sidebarNav').innerHTML = html;
  document.getElementById('drawerNav').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(el=> el.onclick = ()=> switchView(el.dataset.nav));
  document.getElementById('tabbarRow').innerHTML = TABBAR.map(id=>{
    const n = NAV.find(x=>x.id===id);
    return `<div class="tabbtn ${id===state.currentView?'active':''}" data-nav="${id}"><i class="fa-solid ${n.icon}"></i><span>${n.label.split(' ')[0]}</span></div>`;
  }).join('');
  document.querySelectorAll('.tabbtn').forEach(el=> el.onclick = ()=> switchView(el.dataset.nav));
}
function switchView(view){
  state.currentView = view;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  renderNav();
  renderView();
}
function unreadAlertCount(){ return state.session ? state.session.alerts.filter(a=>!a.read).length : 0; }

/* =========================================================================
   VIEW ROUTER
   ========================================================================= */
const VIEWS = {};
function renderView(){
  const fn = VIEWS[state.currentView] || VIEWS.dashboard;
  document.getElementById('content').innerHTML = fn();
  bindViewEvents(state.currentView);
  if(state.currentView==='livemonitoring') ensureChart();
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
VIEWS.dashboard = function(){
  const s = state.session;
  const recentAlerts = s ? s.alerts.slice(0,4) : [];
  const recentHistory = state.history.slice(0,4);
  return `
  <div class="pagehead"><h1>Dashboard</h1><span class="sub">${fmtDateTime(new Date())}</span></div>

  ${s ? `
  <div class="status-banner ${s.status}" style="margin-bottom:16px;">
    <i class="fa-solid ${statusIcon(s.status)} sbicon"></i>
    <div><b>${statusText(s.status)}</b><span>${s.id} · ${s.patientId||'No case ID'} · ${s.ward||'—'}</span></div>
    <button class="btn sm" style="margin-left:auto;" data-action="goto-live">Open Live Monitoring</button>
  </div>` : `
  <div class="panel" style="text-align:center;padding:36px;margin-bottom:16px;">
    <i class="fa-solid fa-droplet" style="font-size:28px;color:var(--muted-2);margin-bottom:10px;"></i>
    <h3 style="margin:0 0 6px;">No active infusion</h3>
    <p style="color:var(--muted);font-size:13px;margin:0 0 16px;">Start a new infusion session to begin monitoring.</p>
    <button class="btn primary" style="width:auto;padding:10px 20px;" data-action="goto-new">+ New Infusion</button>
  </div>`}

  <div class="grid4" style="margin-bottom:16px;">
    <div class="mini"><div class="mlabel">Active Session</div><div class="mval">${s ? '1' : '0'}</div></div>
    <div class="mini"><div class="mlabel">Sessions Logged</div><div class="mval">${state.history.length}</div></div>
    <div class="mini"><div class="mlabel">Unread Alerts</div><div class="mval">${unreadAlertCount()}</div></div>
    <div class="mini"><div class="mlabel">Device Battery</div><div class="mval">${s ? Math.round(s.battery)+'%' : '—'}</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><h3>Recent Alerts</h3><span class="chipbtn" data-action="goto-alerts" style="cursor:pointer;">View all</span></div>
      ${recentAlerts.length ? recentAlerts.map(a=>alertRowHtml(a)).join('') : '<p style="color:var(--muted);font-size:13px;">No alerts yet.</p>'}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Recent Sessions</h3><span class="chipbtn" data-action="goto-history" style="cursor:pointer;">View all</span></div>
      ${recentHistory.length ? `<table><tbody>${recentHistory.map(h=>`<tr><td>${h.id}</td><td>${h.initialVolume} mL @ ${h.targetRate} mL/hr</td><td><span class="pill ${h.finalStatus}">${h.finalStatus}</span></td></tr>`).join('')}</tbody></table>` : '<p style="color:var(--muted);font-size:13px;">No completed sessions yet.</p>'}
    </div>
  </div>`;
};
function statusIcon(s){ return {NORMAL:'fa-circle-check', DEVIATION:'fa-triangle-exclamation', STOPPED:'fa-circle-xmark', COMPLETED:'fa-flag-checkered'}[s] || 'fa-circle'; }
function statusText(s){ return {NORMAL:'Infusion running as expected.', DEVIATION:'Rate outside target range.', STOPPED:'No drops detected. Check the infusion setup.', COMPLETED:'Infusion completed successfully.'}[s] || s; }
function alertRowHtml(a){
  const icon = {Critical:'fa-circle-exclamation', Warning:'fa-triangle-exclamation', Info:'fa-circle-info'}[a.severity];
  const color = {Critical:'var(--red)', Warning:'var(--amber)', Info:'var(--blue)'}[a.severity];
  return `<div class="alert-item ${a.read?'':'unread'}" data-alert-id="${a.id}">
    <div class="aicon" style="color:${color};"><i class="fa-solid ${icon}"></i></div>
    <div class="abody"><div class="atitle">${a.title} <span class="pill ${a.severity}" style="margin-left:6px;">${a.severity}</span></div>
    <div class="adesc">${a.desc}</div><div class="atime">${fmtTime(a.time)}</div></div>
  </div>`;
}

/* =========================================================================
   NEW INFUSION
   ========================================================================= */
const FLUIDS = [
  "Normal Saline (0.9% NaCl)",
  "Ringer's Lactate (Compound Sodium Lactate)",
  "5% Dextrose (D5W)",
  "Dextrose Normal Saline (DNS)",
  "10% Dextrose (D10W)",
  "0.45% Normal Saline (Half Normal Saline)",
  "Dextrose 5% in 0.45% Saline (D5 1/2 NS)",
  "Ringer's Lactate with 5% Dextrose",
  "Plasma-Lyte / Isolyte-P",
  "Mannitol 20%",
  "Albumin 5%",
  "Other",
];
VIEWS.newinfusion = function(){
  const d = state.settings;
  return `
  <div class="pagehead"><h1>New Infusion</h1><span class="sub">Set up a new simulated infusion session</span></div>
  <div class="panel">
    <form id="newInfusionForm">
      <div class="grid2">
        <div class="field"><label>Patient / Case ID (optional)</label><input type="text" id="ni-patient" placeholder="e.g. P-001"></div>
        <div class="field"><label>Ward / Location (optional)</label><input type="text" id="ni-ward" placeholder="e.g. General Ward 1"></div>
      </div>
      <div class="field"><label>Fluid / Solution Type *</label>
        <select id="ni-fluid">${FLUIDS.map(f=>`<option ${f===d.defaultFluid?'selected':''}>${f}</option>`).join('')}</select>
      </div>
      <div class="grid3">
        <div class="field"><label>Initial Fluid Volume (mL) *</label><input type="number" id="ni-volume" value="500" min="10"></div>
        <div class="field"><label>Target Infusion Rate (mL/hr) *</label><input type="number" id="ni-rate" value="${d.defaultTargetRate}" min="1"></div>
        <div class="field"><label>IV Set Drop Factor (drops/mL) *</label><input type="number" id="ni-dropfactor" value="${d.defaultDropFactor}" min="1"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Estimated Starting Weight (g, optional)</label><input type="number" id="ni-startweight" placeholder="e.g. 500"></div>
        <div class="field"><label>Infusion Start Time</label><input type="text" id="ni-starttime" value="${fmtTime(new Date())}" readonly></div>
      </div>
      <div class="field"><label>Notes (optional)</label><textarea id="ni-notes" rows="2" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);"></textarea></div>
      <div class="panel" style="background:var(--blue-tint);border:none;margin-top:4px;">
        <div style="font-size:12px;color:var(--muted);">Expected drop rate</div>
        <div style="font-size:22px;font-weight:800;" id="ni-expected-drops">33 gtt/min</div>
        <div style="font-size:11px;color:var(--muted);">(Target rate × Drop factor) / 60</div>
      </div>
      <div class="err-msg" id="ni-err">Please fill all required fields with valid positive values.</div>
      <div class="btn-row" style="margin-top:14px;">
        <button type="button" class="btn primary" style="width:auto;padding:11px 22px;" id="ni-start">Start Infusion</button>

  {key:'optical', label:'Optical Drop Sensor', icon:'fa-eye'},

VIEWS.selfcheck = function(){
  const sc = state.selfCheck;

      const dotClass = !r ? 'pending' : (r==='fail' ? 'fail' : (r==='warn' ? 'warn' : 'pass'));
      const txt = !r ? 'Pending…' : (r==='fail' ? 'Failed — check connection' : (r==='warn' ? 'Warning' : 'OK'));
      return `<div class="check-row"><div class="ci"><i class="fa-solid ${c.icon}"></i></div>
        <div class="ctext"><b>${c.label}</b><span>${txt}</span></div>
        <div class="check-dot ${dotClass}"></div></div>`;
    }).join('')}
    <div style="margin-top:16px;" class="btn-row">
      <button class="btn primary" style="width:auto;padding:10px 20px;" id="runCheckBtn" ${sc.running?'disabled':''}>${sc.running ? 'Checking…' : 'Run Self-Check'}</button>
      <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);"><input type="checkbox" id="simFailChk" ${sc.simulateFail?'checked':''}> Simulate a failed sensor (demo)</label>
    </div>
    ${sc.done ? (anyFail ? `
      <div class="status-banner STOPPED" style="margin-top:16px;"><i class="fa-solid fa-triangle-exclamation sbicon"></i><div><b>Self-check failed</b><span>Resolve the failed item above, or retry.</span></div></div>
      <button class="btn" style="margin-top:12px;width:auto;" id="retryCheckBtn">Retry</button>
    ` : `
      <div class="status-banner NORMAL" style="margin-top:16px;"><i class="fa-solid fa-circle-check sbicon"></i><div><b>All Systems Ready</b><span>You can start infusion monitoring.</span></div></div>
      <button class="btn primary" style="margin-top:12px;width:auto;padding:10px 20px;" id="continueLiveBtn">Continue to Live Monitoring</button>
    `) : ''}
  </div>`;
};
function bindSelfCheckEvents(){
  const chk = document.getElementById('simFailChk');
  if(chk) chk.onchange = ()=>{ state.selfCheck.simulateFail = chk.checked; };
  const runBtn = document.getElementById('runCheckBtn');
  if(runBtn) runBtn.onclick = ()=>{
    const sc = state.selfCheck;
    sc.running = true; sc.done = false; sc.results = {};
    renderView();
    let i = 0;
    const failKey = sc.simulateFail ? CHECK_ITEMS[Math.floor(Math.random()*CHECK_ITEMS.length)].key : null;
    const iv = setInterval(()=>{
      if(i>=CHECK_ITEMS.length){
        clearInterval(iv); sc.running=false; sc.done=true; renderView();
        return;
      }
      const key = CHECK_ITEMS[i].key;
      sc.results[key] = (key===failKey) ? 'fail' : 'pass';
      renderView();
      i++;
    }, 450);
  };
  const retryBtn = document.getElementById('retryCheckBtn');
  if(retryBtn) retryBtn.onclick = ()=>{ state.selfCheck = {running:false, done:false, simulateFail:false, results:{}}; renderView(); };
  const contBtn = document.getElementById('continueLiveBtn');
  if(contBtn) contBtn.onclick = ()=>{ state.session.running = true; startEngine(); switchView('livemonitoring'); };
}

/* =========================================================================
   SIMULATION ENGINE
   ========================================================================= */
const SPEED_MULT = {1:1, 5:5, 10:10, 30:30};
function noise(n){ return (Math.random()*2-1)*n; }

function startEngine(){
  if(state.engineTimer) clearInterval(state.engineTimer);
  state.engineTimer = setInterval(engineTick, 1000);
}
function stopEngine(){ if(state.engineTimer){ clearInterval(state.engineTimer); state.engineTimer=null; } }

function pushAlert(title, desc, severity){
  const s = state.session; if(!s) return;
  const a = {id:uid('A'), title, desc, severity, time:Date.now(), read:false};
  s.alerts.unshift(a);
  showToast(title, desc, severity);
}

function engineTick(){
  const s = state.session;
  if(!s || !s.running) return;
  const mult = SPEED_MULT[state.settings.simSpeed] || 5;
  const dtSec = 1 * mult; // simulated seconds elapsed per real second
  s.elapsedSec += dtSec;

  // ---- scenario-driven true rate ----
  let goal = s.targetRate;
  const sc = state.demoScenario;
  if(sc==='slow') goal = s.targetRate*0.68;
  else if(sc==='fast') goal = s.targetRate*1.3;
  else if(sc==='interruption') goal = 0;
  else if(sc==='suddenchange') goal = (s._suddenFlip = !s._suddenFlip) ? s.targetRate*1.4 : s.targetRate*0.6;

  s._base = (s._base===undefined? s.targetRate : s._base) + (goal-(s._base===undefined?s.targetRate:s._base))*0.35;
  let optical = Math.max(0, s._base + noise(s.targetRate*0.04));
  let grav = Math.max(0, s._base + noise(s.targetRate*0.05));

  if(sc==='opticalfail') optical = NaN;
  if(sc==='loadcellfail') grav = NaN;
  if(sc==='sensordisagree'){ optical = s.targetRate + noise(3); grav = s.targetRate*0.55 + noise(3); }

  const opticalOk = !isNaN(optical), gravOk = !isNaN(grav);
  const actualRate = opticalOk && gravOk ? (optical+grav)/2 : (opticalOk ? optical : (gravOk ? grav : 0));

  s.opticalRate = opticalOk ? optical : 0;
  s.gravRate = gravOk ? grav : 0;
  s.dropRate = Math.round((actualRate * s.dropFactor)/60);
  s.expectedDropRate = Math.round((s.targetRate * s.dropFactor)/60);

  const deliveredDelta = actualRate * (dtSec/3600);
  s.delivered = Math.min(s.initialVolume, s.delivered + deliveredDelta);
  s.deviationPct = Math.round(((actualRate - s.targetRate)/s.targetRate)*100);
  s.currentWeight = s.startWeight - s.delivered;

  // battery / temperature cosmetics
  if(sc==='lowbattery'){ s.battery = Math.max(2, s.battery - 0.6); }
  else { s.battery = Math.max(5, s.battery - 0.03*mult); }
  s.temperature = 27 + noise(1.2);

  // random faults (only if explicitly enabled)
  if(state.randomFaults && Math.random() < 0.01){
    pushAlert('Unexpected rate fluctuation','A brief, isolated reading spike was observed.','Warning');
  }

  // ---- no-drop timeout tracking ----
  if(actualRate < s.targetRate*0.1){ s.noDropSeconds += dtSec; } else { s.noDropSeconds = 0; }

  // ---- persistence-gated status ----
  const sensorGap = (opticalOk && gravOk) ? Math.abs(optical-grav)/s.targetRate*100 : 0;
  let candidate = 'NORMAL';
  if(s.noDropSeconds >= state.settings.noDropTimeout) candidate = 'STOPPED';
  else if(sensorGap > state.settings.sensorDisagreementThreshold) candidate = 'DEVIATION';
  else if(s.deviationPct <= state.settings.minDeviation || s.deviationPct >= state.settings.maxDeviation) candidate = 'DEVIATION';

  s.statusBuf.push(candidate);
  if(s.statusBuf.length>4) s.statusBuf.shift();
  const allSame = s.statusBuf.length>=4 && s.statusBuf.every(x=>x===s.statusBuf[0]);
  const prevStatus = s.status;
  if(candidate==='NORMAL'){ if(s.statusBuf.every(x=>x==='NORMAL')) s.status='NORMAL'; }
  else if(allSame){ s.status = candidate; }

  if(s.status!==prevStatus){
    if(s.status==='STOPPED') pushAlert('No drops detected for '+state.settings.noDropTimeout+' seconds','Infusion appears interrupted.','Critical');
    else if(s.status==='DEVIATION' && candidate==='DEVIATION' && sensorGap>state.settings.sensorDisagreementThreshold) pushAlert('Sensor inconsistency detected','Optical and load-cell readings disagree beyond the configured threshold.','Warning');
    else if(s.status==='DEVIATION') pushAlert('Flow rate '+(s.deviationPct<0?'below':'above')+' target ('+s.deviationPct+'%)','Persistent deviation confirmed across multiple readings.','Warning');
    else if(s.status==='NORMAL' && prevStatus!=='NORMAL') pushAlert('Infusion resumed','Flow rate has returned to the expected range.','Info');
  }
  if(s.battery<=state.settings.lowBatteryThreshold && !s._lowBattAlerted){ s._lowBattAlerted=true; pushAlert('Low battery','Device battery below configured threshold.','Warning'); }

  // ---- completion ----
  if(s.delivered >= s.initialVolume - 0.5 && !s.completed){
    s.completed = true; s.running = false; s.status='COMPLETED'; stopEngine();
    pushAlert('Infusion completed','Target volume fully delivered.','Info');
    finalizeSession('Completed');
  }

  s.history.push({ t:s.elapsedSec, time:Date.now(), expectedVolume: Math.min(s.initialVolume, s.targetRate*(s.elapsedSec/3600)),
    actualVolume:s.delivered, expectedRate:s.targetRate, actualRate:Math.round(actualRate), dropRate:s.dropRate, weight:Math.round(s.currentWeight), status:s.status });
  if(s.history.length>2000) s.history.shift();

  if(['livemonitoring','parameters','dashboard','alerts'].includes(state.currentView)) renderView();
}

function finalizeSession(finalStatusLabel){
  const s = state.session; if(!s) return;
  const record = {
    id:s.id, patientId:s.patientId, ward:s.ward, fluid:s.fluid, startTime:s.startTime, endTime:Date.now(),
    initialVolume:s.initialVolume, delivered:Math.round(s.delivered), targetRate:s.targetRate,
    avgActualRate: s.history.length ? Math.round(s.history.reduce((a,h)=>a+h.actualRate,0)/s.history.length) : s.targetRate,
    durationSec:s.elapsedSec, totalAlerts:s.alerts.length, noDropEvents:s.alerts.filter(a=>a.title.includes('No drops')).length,
    finalStatus: finalStatusLabel, history:s.history.slice(), alerts:s.alerts.slice(),
  };
  state.history.unshift(record); saveHistory();
}

    <div class="grid3">
      <div class="mini"><div class="mlabel">Initial Volume</div><div class="mval">${s.initialVolume}<small>mL</small></div></div>
      <div class="mini"><div class="mlabel">Remaining Volume</div><div class="mval">${Math.round(remaining)}<small>mL</small></div></div>

    <div class="btn-row">

function scenarioLabel(sc){
  return {normal:'Normal', slow:'Slow Infusion', fast:'Fast Infusion', interruption:'Flow Interruption',
    opticalfail:'Optical Sensor Failure', loadcellfail:'Load Cell Failure', sensordisagree:'Sensor Disagreement',
    lowbattery:'Low Battery', suddenchange:'Sudden Rate Change'}[sc];
}

/* ---------------- Chart.js ---------------- */
function ensureChart(){
  const canvas = document.getElementById('infusionChart');
  if(!canvas || typeof Chart==='undefined') return;
  const s = state.session; if(!s) return;
  let hist = s.history;
  if(state.graphRange==='5min') hist = hist.filter(h=> h.t >= s.elapsedSec-300);
  else if(state.graphRange==='15min') hist = hist.filter(h=> h.t >= s.elapsedSec-900);
  const labels = hist.map(h=> (h.t/3600).toFixed(2));
  const expected = hist.map(h=> Math.round(h.expectedVolume));
  const actual = hist.map(h=> Math.round(h.actualVolume));
  if(state.chart){ state.chart.destroy(); }
  state.chart = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Expected Volume', data:expected, borderColor:'#2E5FB8', borderDash:[6,4], pointRadius:0, tension:0.15},
      {label:'Actual Volume', data:actual, borderColor:'#DC3B3B', pointRadius:0, tension:0.15, borderWidth:2.4},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      scales:{ x:{title:{display:true,text:'Time (hours)'}}, y:{title:{display:true,text:'Volume (mL)'}, beginAtZero:true} },
      plugins:{ legend:{position:'top'}, tooltip:{mode:'index', intersect:false} },
    }
  });
}

VIEWS.history = function(){

    const q = state.historySearch.toLowerCase();
    const matchesQ = !q || h.id.toLowerCase().includes(q) || (h.patientId||'').toLowerCase().includes(q);
    const matchesStatus = state.historyStatusFilter==='All' || h.finalStatus===state.historyStatusFilter;
    return matchesQ && matchesStatus;
  });
  list.sort((a,b)=> state.historySort==='newest' ? b.startTime-a.startTime : a.startTime-b.startTime);
  return `
  <div class="pagehead"><h1>Infusion History</h1><span class="sub">${list.length} session(s)</span></div>
  <div class="filter-row">
    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="historySearchInput" placeholder="Search by session or patient ID..." value="${state.historySearch}"></div>
    <select class="seg" id="historyStatusSelect" style="border:1px solid var(--border);border-radius:9px;padding:7px 10px;">
      ${['All','Completed','Stopped Early','Interrupted'].map(st=>`<option ${state.historyStatusFilter===st?'selected':''}>${st}</option>`).join('')}
    </select>
    <select class="seg" id="historySortSelect" style="border:1px solid var(--border);border-radius:9px;padding:7px 10px;">
      <option value="newest" ${state.historySort==='newest'?'selected':''}>Newest first</option>
      <option value="oldest" ${state.historySort==='oldest'?'selected':''}>Oldest first</option>
    </select>
  </div>
  <div class="panel">
    <table><thead><tr><th>Session</th><th>Patient</th><th>Volume / Rate</th><th>Start</th><th>Status</th><th></th></tr></thead>
    <tbody>${list.map(h=>`<tr>
      <td class="rowlink" data-open-history="${h.id}">${h.id}</td><td>${h.patientId||'—'}</td>
      <td>${h.initialVolume} mL @ ${h.targetRate} mL/hr</td><td>${fmtDateTime(h.startTime)}</td>
      <td><span class="pill ${h.finalStatus}">${h.finalStatus}</span></td>
      <td><button class="btn sm danger" data-delete-history="${h.id}">Delete</button></td>
    </tr>`).join('')}</tbody></table>
    ${!list.length ? '<p style="color:var(--muted);font-size:13px;padding:10px 0;">No matching sessions.</p>' : ''}
  </div>`;
};

/* =========================================================================

    targetRate:latest.targetRate, history:latest.history, alerts:latest.alerts, elapsedSec:latest.durationSec,

/* =========================================================================
   PER-VIEW EVENT BINDING
   ========================================================================= */
function bindViewEvents(view){
  if(view==='newinfusion') bindNewInfusionEvents();
  if(view==='selfcheck') bindSelfCheckEvents();

  if(view==='livemonitoring'){
    const sp = document.getElementById('simSpeedSelect');
    if(sp) sp.onchange = ()=>{ state.settings.simSpeed = +sp.value; saveSettings(); };
    document.querySelectorAll('[data-scenario]').forEach(b=> b.onclick = ()=>{ state.demoScenario = b.dataset.scenario; renderView(); });
    document.querySelectorAll('[data-range]').forEach(b=> b.onclick = ()=>{ state.graphRange = b.dataset.range; renderView(); });
    const rf = document.getElementById('randomFaultsChk');
    if(rf) rf.onchange = ()=>{ state.randomFaults = rf.checked; };
  }

  if(view==='parameters'){
    document.querySelectorAll('[data-paramview]').forEach(b=> b.onclick = ()=>{ state.paramView = b.dataset.paramview; renderView(); });
  }

  if(view==='alerts'){
    document.querySelectorAll('[data-alertfilter]').forEach(b=> b.onclick = ()=>{ state.alertFilter = b.dataset.alertfilter; renderView(); });
    document.querySelectorAll('[data-alert-id]').forEach(el=> el.onclick = ()=>{
      const s = state.session; const a = s.alerts.find(x=>x.id===el.dataset.alertId);
      if(a){ a.read = true; renderView(); }
    });
  }

  if(view==='history'){
    const si = document.getElementById('historySearchInput');
    if(si) si.oninput = ()=>{ state.historySearch = si.value; renderView(); const el=document.getElementById('historySearchInput'); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;} };
    const ss = document.getElementById('historyStatusSelect');
    if(ss) ss.onchange = ()=>{ state.historyStatusFilter = ss.value; renderView(); };
    const so = document.getElementById('historySortSelect');
    if(so) so.onchange = ()=>{ state.historySort = so.value; renderView(); };
    document.querySelectorAll('[data-open-history]').forEach(el=> el.onclick = ()=>{
      const h = state.history.find(x=>x.id===el.dataset.openHistory);
      showModal('Session '+h.id, `${h.initialVolume} mL @ ${h.targetRate} mL/hr — ${h.finalStatus}<br>Delivered: ${Math.round(h.delivered)} mL · Duration: ${fmtDur(h.durationSec)} · Alerts: ${h.totalAlerts}`, [{label:'Close'}]);
    });
    document.querySelectorAll('[data-delete-history]').forEach(el=> el.onclick = ()=> confirmModal('Delete session?','This cannot be undone.', ()=>{
      state.history = state.history.filter(x=>x.id!==el.dataset.deleteHistory); saveHistory(); renderView();
    }));
  }

  if(view==='calibration') bindCalibrationEvents();
  if(view==='settings') bindSettingsEvents();
}

function bindCalibrationEvents(){
  const c = state.calibration;
  document.getElementById('cal-start-lc').onclick = ()=>{
    const known = parseFloat(document.getElementById('cal-weight').value)||500;
    c.loadCell.knownWeight = known;
    c.loadCell.rawValue = Math.round(known * (0.98+Math.random()*0.04));
    document.getElementById('cal-raw').textContent = c.loadCell.rawValue;
    showToast('Load cell calibration','Simulated raw sensor value captured.','Info');
  };
  document.getElementById('cal-apply-lc').onclick = ()=>{
    if(!c.loadCell.rawValue){ showToast('Calibration','Run "Start Calibration" first.','Warning'); return; }
    c.loadCell.factor = +(c.loadCell.knownWeight / c.loadCell.rawValue).toFixed(3);
    c.loadCell.done = true; c.loadCell.lastDate = Date.now();
    saveCalibration(); renderView();
    showToast('Load cell calibrated', 'Calibration factor applied (simulated).', 'Info');
  };
  document.getElementById('cal-reset-lc').onclick = ()=>{ c.loadCell = JSON.parse(JSON.stringify(DEFAULT_CALIBRATION.loadCell)); saveCalibration(); renderView(); };
  document.getElementById('cal-start-opt').onclick = ()=>{ document.getElementById('cal-opt-reading').textContent = 'Reading…'; };
  document.getElementById('cal-simdrop').onclick = ()=>{
    document.getElementById('cal-opt-reading').textContent = 'Drop detected ✓';
  };
  document.getElementById('cal-sensitivity').oninput = (e)=>{ c.optical.sensitivity = +e.target.value; };
  document.getElementById('cal-save-opt').onclick = ()=>{
    c.optical.done = true; c.optical.lastDate = Date.now(); saveCalibration(); renderView();
    showToast('Optical sensor calibrated','Sensitivity setting saved (simulated).','Info');
  };
  document.getElementById('cal-reset-opt').onclick = ()=>{ c.optical = JSON.parse(JSON.stringify(DEFAULT_CALIBRATION.optical)); saveCalibration(); renderView(); };
}

function bindSettingsEvents(){
  document.getElementById('toggleThemeSetting').onclick = toggleTheme;
  document.getElementById('toggleSound').onclick = ()=>{ state.settings.soundOn = !state.settings.soundOn; saveSettings(); renderView(); };
  document.getElementById('toggleNotif').onclick = ()=>{ state.settings.notifPref = !state.settings.notifPref; saveSettings(); renderView(); };
  document.getElementById('saveThresholdsBtn').onclick = ()=>{
    const d = state.settings;
    d.defaultDropFactor = +document.getElementById('set-dropfactor').value;
    d.defaultFluid = document.getElementById('set-fluid').value;
    d.defaultTargetRate = +document.getElementById('set-rate').value;
    d.maxDeviation = +document.getElementById('set-maxdev').value;
    d.minDeviation = +document.getElementById('set-mindev').value;
    d.noDropTimeout = +document.getElementById('set-nodroptimeout').value;
    d.lowBatteryThreshold = +document.getElementById('set-lowbatt').value;
    d.sensorDisagreementThreshold = +document.getElementById('set-sensorgap').value;
    d.deviceName = document.getElementById('set-devname').value;
    d.deviceId = document.getElementById('set-devid').value;
    saveSettings();
    showToast('Settings saved','Your changes have been applied and saved to this browser.','Info');
  };
  document.getElementById('resetSettingsBtn').onclick = ()=> confirmModal('Reset all settings?','This restores all defaults.', ()=>{
    state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); saveSettings(); document.body.dataset.theme=state.settings.theme; renderView();
  });
  document.getElementById('clearDataBtn').onclick = ()=> confirmModal('Clear local application data?','This deletes all saved history, settings and calibration from this browser. This cannot be undone.', ()=>{
    localStorage.clear(); location.reload();
  });
}

/* =========================================================================
   EXPORTS
   ========================================================================= */
function activeOrLatestTarget(){
  const s = state.session;
  if(s && (s.completed || s.stopped)) return s;
  if(state.history[0]){
    const h = state.history[0];
    return {id:h.id, patientId:h.patientId, ward:h.ward, fluid:h.fluid, initialVolume:h.initialVolume, delivered:h.delivered,
      targetRate:h.targetRate, history:h.history, alerts:h.alerts, elapsedSec:h.durationSec, startTime:h.startTime, endTime:h.endTime, finalStatus:h.finalStatus};
  }
  return s || null;
}
function safeISO(ts){ try{ return new Date(ts||Date.now()).toISOString(); }catch(e){ return new Date().toISOString(); } }
function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(){
  const t = activeOrLatestTarget(); if(!t){ showToast('Export CSV','No session data available.','Warning'); return; }
  const rows = [['Timestamp','Elapsed (s)','Expected Volume (mL)','Actual Volume (mL)','Expected Rate (mL/hr)','Actual Rate (mL/hr)','Drop Rate (gtt/min)','Est. Weight (g)','Status']];
  t.history.forEach(h=> rows.push([safeISO(h.time), h.t, Math.round(h.expectedVolume), Math.round(h.actualVolume), h.expectedRate, h.actualRate, h.dropRate, h.weight, h.status]));
  const csv = rows.map(r=> r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadBlob((t.id||'secureiv')+'_data.csv', new Blob([csv],{type:'text/csv'}));
}
function exportAllHistoryCSV(){
  if(!state.history.length){ showToast('Export','No completed sessions yet.','Warning'); return; }
  const rows = [['Session','Patient','Fluid','Initial Volume','Target Rate','Avg Actual Rate','Duration (s)','Total Alerts','Status','Start','End']];
  state.history.forEach(h=> rows.push([h.id, h.patientId||'', h.fluid, h.initialVolume, h.targetRate, h.avgActualRate, h.durationSec, h.totalAlerts, h.finalStatus, safeISO(h.startTime), safeISO(h.endTime)]));
  const csv = rows.map(r=> r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadBlob('secureiv_all_sessions.csv', new Blob([csv],{type:'text/csv'}));
}
function exportPNG(){
  if(!state.chart){ showToast('Save graph','Open Live Monitoring with an active or recent session first.','Warning'); return; }
  const a = document.createElement('a'); a.href = state.chart.toBase64Image(); a.download = 'secureiv_infusion_graph.png'; a.click();
}
function exportPDF(){
  const t = activeOrLatestTarget(); if(!t){ showToast('Export PDF','No session data available.','Warning'); return; }
  if(typeof window.jspdf==='undefined'){ showToast('Export PDF','PDF library failed to load (check your internet connection).','Warning'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  try{ doc.addImage(LOGO_SRC, 'PNG', 14, 10, 42, 15); }catch(e){}
  doc.setFontSize(14); doc.text('SECURE-IV — Infusion Report', 60, 20);
  doc.setFontSize(10);
  const info = [
    ['Session ID', t.id], ['Patient / Case ID', t.patientId||'—'], ['Ward', t.ward||'—'], ['Fluid', t.fluid||'—'],
    ['Initial Volume', t.initialVolume+' mL'], ['Delivered Volume', Math.round(t.delivered)+' mL'],
    ['Target Rate', t.targetRate+' mL/hr'], ['Status', t.finalStatus||t.status], ['Total Alerts', (t.alerts||[]).length],
  ];
  doc.autoTable({ startY: 32, head:[['Field','Value']], body: info, theme:'grid', styles:{fontSize:9} });
  if(state.chart){
    try{ doc.addImage(state.chart.toBase64Image(), 'PNG', 14, doc.lastAutoTable.finalY+8, 180, 90); }catch(e){}
  }
  doc.setFontSize(8); doc.text('Simulated demonstration report — not a clinical document.', 14, 285);
  doc.save((t.id||'secureiv')+'_report.pdf');
}
function printReport(){ window.print(); }

/* =========================================================================
   GLOBAL CLICK DELEGATION (data-action)
   ========================================================================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(a==='goto-new') switchView('newinfusion');
  else if(a==='goto-live') switchView('livemonitoring');
  else if(a==='goto-alerts') switchView('alerts');
  else if(a==='goto-history') switchView('history');
  else if(a==='sim-pause'){ state.session.running=false; stopEngine(); renderView(); }
  else if(a==='sim-resume'){ state.session.running=true; startEngine(); renderView(); }
  else if(a==='sim-stop'){ confirmModal('Stop infusion?','This ends the current session and generates a summary report.', ()=>{
      const s = state.session; s.running=false; s.stopped=true; s.status='STOPPED'; stopEngine();
      finalizeSession(s.delivered < s.initialVolume*0.98 ? 'Stopped Early' : 'Completed');
      switchView('reports');
    }); }
  else if(a==='sim-reset'){ confirmModal('Reset simulation?','This clears the current live session (not your saved history).', ()=>{
      stopEngine(); state.session=null; state.demoScenario='normal'; switchView('dashboard');
    }); }
  else if(a==='sim-testalert'){ pushAlert('Test alert','This is a manually triggered test alert.','Info'); renderView(); }
  else if(a==='mark-all-read'){ state.session.alerts.forEach(x=>x.read=true); renderView(); }
  else if(a==='clear-alerts'){ confirmModal('Clear alert history?','This removes all alerts for the current session.', ()=>{ state.session.alerts=[]; renderView(); }); }
  else if(a==='clear-graph'){ confirmModal('Clear graph?','This clears recorded history points for the current session graph.', ()=>{ state.session.history=[]; renderView(); }); }
  else if(a==='export-csv') exportCSV();
  else if(a==='export-all-csv') exportAllHistoryCSV();
  else if(a==='export-png') exportPNG();
  else if(a==='export-pdf') exportPDF();
  else if(a==='print-report') printReport();
});

/* =========================================================================
   INIT
   ========================================================================= */
renderLogin();
